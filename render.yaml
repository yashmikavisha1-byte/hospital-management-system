services:
  - type: web
    name: hospital-management-api
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://yashmikavisha1-byte.github.io
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_PATIENT_EMAIL
        sync: false
      - key: BOOTSTRAP_PATIENT_PASSWORD
        sync: false
      - key: BOOTSTRAP_PATIENT_NAME
        sync: false
      - key: BOOTSTRAP_PATIENT_AGE
        sync: false
      - key: BOOTSTRAP_PATIENT_GENDER
        sync: false
      - key: BOOTSTRAP_PATIENT_PHONE
        sync: false
      - key: BOOTSTRAP_PATIENT_ADDRESS
        sync: false
