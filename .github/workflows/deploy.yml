name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://cases-ministries-inexpensive-handhelds.trycloudflare.com/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Validate API URL
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is empty."
            exit 1
          fi
          case "$VITE_API_URL" in
            https://*/api) ;;
            *)
              echo "::error::VITE_API_URL must be an HTTPS URL ending in /api."
              exit 1
              ;;
          esac
      - run: npm run build
        working-directory: client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4